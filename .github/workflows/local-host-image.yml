name: Build local-host image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Build the local-host image
        run: docker build --tag rope-pull-arena:local .

      - name: Smoke test the container
        run: |
          docker run --detach --name rope-pull-test --publish 3000:3000 rope-pull-arena:local
          trap 'docker logs rope-pull-test; docker rm --force rope-pull-test' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Export image for local hosting
        run: docker save rope-pull-arena:local | gzip > rope-pull-arena.tar.gz

      - name: Upload local-host image
        uses: actions/upload-artifact@v4
        with:
          name: rope-pull-arena-${{ github.run_number }}
          path: rope-pull-arena.tar.gz
          retention-days: 14
